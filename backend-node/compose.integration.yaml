services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_test_only_root
      MYSQL_DATABASE: goodlook_disposable_test
      MYSQL_USER: goodlook_test
      MYSQL_PASSWORD: local_test_only_password
    ports:
      - '127.0.0.1:33317:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -plocal_test_only_root --silent']
      interval: 2s
      timeout: 3s
      retries: 45

      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Ficha actualizada. }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

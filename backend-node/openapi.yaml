        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Horario sustituido. }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CodeForbidden' }
        '409': { $ref: '#/components/responses/ManagementConflict' }
  /api/manage/businesses/{id}/staff/{professionalId}/closures:
    get:
      tags: [gestion]
      operationId: getApiManageBusinessesByIdStaffByProfessionalIdClosures
      summary: Cierres del perfil
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/ProfessionalId' }
      responses:
        '400': { $ref: '#/components/responses/InvalidJson' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Cierres del perfil.
          content:
            application/json:
              schema:
                type: object
                required: [closures]
                properties:
                  closures:
                    type: array
                    items: { $ref: '#/components/schemas/Closure' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CodeForbidden' }
    post:
      tags: [gestion]
      operationId: postApiManageBusinessesByIdStaffByProfessionalIdClosures
      summary: Crea un cierre
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/ProfessionalId' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Impact' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt]
              properties:
                startAt: { $ref: '#/components/schemas/UtcTimestamp' }
                endAt: { $ref: '#/components/schemas/UtcTimestamp' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Cierre creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Closure' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CodeForbidden' }
        '409': { $ref: '#/components/responses/ManagementConflict' }
  /api/manage/businesses/{id}/staff/{professionalId}/closures/{closureId}:
    delete:
      tags: [gestion]
      operationId: deleteApiManageBusinessesByIdStaffByProfessionalIdClosuresByClosureId
      summary: Elimina un cierre
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/ProfessionalId' }
        - name: closureId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - { $ref: '#/components/parameters/Origin' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Cierre eliminado. }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CodeForbidden' }
  /api/manage/businesses/{id}/staff/{professionalId}/invitation:
    delete:
      tags: [invitaciones]
      operationId: deleteApiManageBusinessesByIdStaffByProfessionalIdInvitation
      summary: Revoca las invitaciones vigentes del perfil
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/ProfessionalId' }
        - { $ref: '#/components/parameters/Origin' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Invitaciones vigentes revocadas. }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CodeForbidden' }
  /api/invitations:
    post:
      tags: [invitaciones]
      operationId: postApiInvitations
      summary: Emite una invitación de un uso
      description: |
        Owner o admin. El token caduca a los siete días. Revoca las
        invitaciones vigentes del mismo perfil. La respuesta es el único
        momento en que el token viaja en claro.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId, professionalId]
              properties:
                businessId: { $ref: '#/components/schemas/Uuid' }
                professionalId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Token para entregar por un canal privado.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresInSeconds]
                properties:
                  token: { type: string, pattern: '^[a-f0-9]{64}$' }
                  expiresInSeconds: { type: integer, enum: [604800] }
        '400':
          description: Entrada no válida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorText' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
  /api/invitations/accept:
    post:
      tags: [invitaciones]
      operationId: postApiInvitationsAccept
      summary: Acepta una invitación con la cuenta de la sesión
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Perfil vinculado. }
        '400':
          description: Token con formato no válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorText' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: goodlook_session
      description: Token hexadecimal de 32 bytes. El servidor guarda solo su SHA-256.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string }
      description: Debe ser exactamente `APP_ORIGIN`.
    Impact:
      name: X-GoodLook-Impact
      in: header
      required: false
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      description: Token devuelto por un 409 `impact_confirmation_required`.
    BusinessId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProfessionalId:
      name: professionalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    BusinessIdQuery:
      name: businessId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CatalogPage:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    CatalogLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: La consulta pide `limit+1` filas y recorta el array a `limit`.
    From:
      name: from
      in: query
      required: true
      schema: { $ref: '#/components/schemas/UtcTimestamp' }
    To:
      name: to
      in: query
      required: true
      schema: { $ref: '#/components/schemas/UtcTimestamp' }
  headers:
    PublicCatalogCache:
      description: Caché de borde. Los 400 y 404 de `/api/catalog` usan `no-store`.
      schema: { type: string, enum: ['public, s-maxage=60, stale-while-revalidate=300'] }
    XHasMore:
      description: Si hay otra página. El cuerpo sigue siendo un array.
      schema: { type: string, enum: ['true', 'false'] }
    CatalogNextLink:
      description: Solo si `X-Has-More` es true. Ruta relativa, sin Host.
      schema: { type: string }
    CatalogExposeHeaders:
      description: Para que el navegador lea las cabeceras si hay CORS.
      schema: { type: string, enum: ['X-Has-More, Link'] }
    CatalogNoStore:
      description: Errores de catálogo público. No cachear.
      schema: { type: string, enum: [no-store] }
  responses:
    ErrorInvalid:
      description: Entrada no válida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorText' }
    UnauthorizedError:
      description: Sin sesión.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [Unauthorized] }
    Unauthenticated:
      description: Sin sesión.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [unauthenticated] }
    ForbiddenOrigin:
      description: El origen no coincide con `APP_ORIGIN`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: ['Forbidden origin'] }
    InvalidJson:
      description: El cuerpo no es JSON. El middleware lo rechaza antes de la ruta.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: ['Invalid JSON'] }
    RequestTooLarge:
      description: El cuerpo supera 32 KiB.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: ['Request too large'] }
    TooManyRequests:
      description: Cupo del limitador agotado.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: ['Too many requests'] }
    UnavailableError:
      description: El limitador no puede consultar la base.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: ['Service unavailable'] }
    ScheduleInvalid:
      description: |
        Identificador que no es un UUID, o franja inválida en el `PUT`.
        `catalog/routes.ts` responde `{ "error": "invalid" }`. En el proceso
        real el `PUT` pasa por gestión y traduce `invalid_input` a ese mismo
        `error`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [invalid] }
    ScheduleNotFound:
      description: |
        El profesional no existe o no está activo en ese negocio.
        La ruta responde `{ "error": "not_found" }`, tanto si el error sale
        de `CatalogError` como de `ManagementError`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [not_found] }
    CatalogError:
      description: Error del catálogo de piloto. `error` es `invalid`, `forbidden` o `not_found`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorText' }
    CatalogForbidden:
      description: Origen no permitido o rol insuficiente. El cuerpo usa `error`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorText' }
    AppointmentError:
      description: |
        Cuerpo `{ "error": "<código>" }`. Códigos: `invalid` (400),
        `unavailable` (422), `conflict` (409), `forbidden` (403),
        `offer_changed` (409), `slot_unavailable` (409),
        `idempotency_conflict` (409).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorText' }
    CodeInvalid:
      description: Entrada no válida.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [invalid_input] }
    CodeForbidden:
      description: Sesión sin permiso, u origen distinto en una escritura.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [forbidden] }
    CodeNotFound:
      description: Recurso inexistente o no publicado, según la ruta.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [not_found] }
    InternalCode:
      description: Fallo no clasificado de la ruta de producto.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [internal_error] }
    ManagementConflict:
      description: |
        Conflicto de gestión. Puede ser `publication_incomplete`,
        `timezone_has_bookings` o `impact_confirmation_required`.
        En el catálogo de piloto el campo se llama `error` y un
        `invalid_input` de gestión se reescribe como `invalid`.
        En `/api/manage` el campo se llama `code`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImpactBody' }
  schemas:
    Uuid:
      type: string
      format: uuid
    UtcTimestamp:
      type: string
      description: Instante UTC con milisegundos, `YYYY-MM-DDTHH:mm:ss.sssZ`.
      example: '2030-01-07T09:00:00.000Z'
    ErrorText:
      type: object
      required: [error]
      properties:
        error: { type: string }
    PublicUser:
      type: object
      required: [id, email, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string }
        displayName: { type: string }
    WorkPeriod:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: 'Día ISO, lunes = 1.' }
        startTime: { type: string, example: '09:00' }
        endTime: { type: string, description: 'Hora local HH:mm. El fin puede ser 24:00.', example: '18:00' }
    CatalogService:
      type: object
      required: [id, businessId, name, durationMinutes, priceCents, currency]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        businessId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ServiceWrite:
      type: object
      required: [name, durationMinutes, priceCents, currency]
      properties:
        name: { type: string, maxLength: 160 }
        durationMinutes: { type: integer, minimum: 1, maximum: 65535 }
        priceCents: { type: integer, minimum: 0, maximum: 4294967295 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    PublicBusiness:
      type: object
      required: [id, name, timezone]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        sector: { type: string, nullable: true }
        address: { type: string, nullable: true }
        timezone: { type: string }
    PublicService:
      allOf:
        - $ref: '#/components/schemas/CatalogService'
        - type: object
          required: [active]
          properties:
            description: { type: string, nullable: true }
            active: { type: boolean, enum: [true] }
    PublicStaff:
      type: object
      required: [id, displayName, active, linked, serviceIds]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        active: { type: boolean, enum: [true] }
        linked: { type: boolean, enum: [true] }
        serviceIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    Slot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        endAt: { $ref: '#/components/schemas/UtcTimestamp' }
    Quote:
      type: object
      required: [priceCents, currency, durationMinutes]
      properties:
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        durationMinutes: { type: integer, minimum: 1 }
    PilotBooking:
      type: object
      required: [businessId, professionalId, serviceId, startAt]
      properties:
        businessId: { $ref: '#/components/schemas/Uuid' }
        professionalId: { $ref: '#/components/schemas/Uuid' }
        serviceId: { $ref: '#/components/schemas/Uuid' }
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        notes: { type: string, nullable: true, maxLength: 500 }
    ProductBooking:
      allOf:
        - $ref: '#/components/schemas/PilotBooking'
        - type: object
          required: [quote]
          properties:
            quote: { $ref: '#/components/schemas/Quote' }
    Appointment:
      type: object
      required: [id, businessId, professionalId, serviceId, customerUserId, startAt, endAt, priceCents, currency, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        businessId: { $ref: '#/components/schemas/Uuid' }
        professionalId: { $ref: '#/components/schemas/Uuid' }
        serviceId: { $ref: '#/components/schemas/Uuid' }
        customerUserId: { $ref: '#/components/schemas/Uuid' }
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        endAt: { $ref: '#/components/schemas/UtcTimestamp' }
        priceCents: { type: integer }
        currency: { type: string }
        status: { type: string }
    CustomerAppointment:
      type: object
      required: [id, businessId, professionalId, serviceId, startAt, endAt, status, priceCents, currency]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        businessId: { $ref: '#/components/schemas/Uuid' }
        professionalId: { $ref: '#/components/schemas/Uuid' }
        serviceId: { $ref: '#/components/schemas/Uuid' }
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        endAt: { $ref: '#/components/schemas/UtcTimestamp' }
        status: { type: string }
        priceCents: { type: integer }
        currency: { type: string }
    PilotAgendaRow:
      type: object
      description: Nombres de columna SQL, distintos del camelCase de las otras citas.
      required: [id, service_id, customer_user_id, start_at, end_at, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        service_id: { $ref: '#/components/schemas/Uuid' }
        customer_user_id: { $ref: '#/components/schemas/Uuid' }
        start_at: { type: string }
        end_at: { type: string }
        status: { type: string }
        notes: { type: string, nullable: true }
    BookingConflict:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [offer_changed, slot_unavailable, idempotency_conflict]
        quote: { $ref: '#/components/schemas/Quote' }
    Membership:
      type: object
      required: [businessId, businessName, timezone, role, professionalId]
      properties:
        businessId: { $ref: '#/components/schemas/Uuid' }
        businessName: { type: string }
        timezone: { type: string }
        role: { type: string, enum: [owner, admin, professional] }
        professionalId: { $ref: '#/components/schemas/Uuid', nullable: true }
    BookingPageItem:
      type: object
      required: [id, businessId, businessName, timezone, professionalId, professionalName, serviceId, serviceName, status, priceCents, currency, startAt, endAt, durationMinutes]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        businessId: { $ref: '#/components/schemas/Uuid' }
        businessName: { type: string }
        timezone: { type: string }
        professionalId: { $ref: '#/components/schemas/Uuid' }
        professionalName: { type: string }
        serviceId: { $ref: '#/components/schemas/Uuid' }
        serviceName: { type: string }
        status: { type: string }
        priceCents: { type: integer }
        currency: { type: string }
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        endAt: { $ref: '#/components/schemas/UtcTimestamp' }
        durationMinutes: { type: number }
    BookingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BookingPageItem' }
        nextCursor: { type: string, nullable: true }
    AgendaAppointment:
      type: object
      required: [id, startAt, endAt, serviceId, serviceName, customerName, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        endAt: { $ref: '#/components/schemas/UtcTimestamp' }
        serviceId: { $ref: '#/components/schemas/Uuid' }
        serviceName: { type: string }
        customerName: { type: string }
        status: { type: string }
        notes: { type: string, nullable: true }
    AgendaWeek:
      type: object
      required: [timezone, from, to, hours, closures, appointments]
      properties:
        timezone: { type: string }
        from: { $ref: '#/components/schemas/UtcTimestamp' }
        to: { $ref: '#/components/schemas/UtcTimestamp' }
        hours:
          type: array
          items: { $ref: '#/components/schemas/WorkPeriod' }
        closures:
          type: array
          items:
            type: object
            required: [id, startAt, endAt]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              startAt: { $ref: '#/components/schemas/UtcTimestamp' }
              endAt: { $ref: '#/components/schemas/UtcTimestamp' }
        appointments:
          type: array
          items: { $ref: '#/components/schemas/AgendaAppointment' }
    BusinessProfileWrite:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, maxLength: 160 }
        timezone: { type: string }
        sector: { type: string, nullable: true, maxLength: 80 }
        address: { type: string, nullable: true, maxLength: 250 }
    BusinessProfilePatch:
      type: object
      description: Al menos uno de los campos.
      properties:
        name: { type: string, maxLength: 160 }
        timezone: { type: string }
        sector: { type: string, nullable: true, maxLength: 80 }
        address: { type: string, nullable: true, maxLength: 250 }
    BusinessProfile:
      type: object
      required: [id, name, timezone, isPublic]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        timezone: { type: string }
        sector: { type: string, nullable: true }
        address: { type: string, nullable: true }
        isPublic: { type: boolean }
    ManagedServiceWrite:
      allOf:
        - $ref: '#/components/schemas/ServiceWrite'
        - type: object
          properties:
            description: { type: string, nullable: true, maxLength: 500 }
    ManagedServicePatch:
      type: object
      description: Al menos un campo.
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true, maxLength: 500 }
        durationMinutes: { type: integer, minimum: 1, maximum: 65535 }
        priceCents: { type: integer, minimum: 0, maximum: 4294967295 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        active: { type: boolean }
    ManagedService:
      allOf:
        - $ref: '#/components/schemas/CatalogService'
        - type: object
          required: [active]
          properties:
            description: { type: string, nullable: true }
            active: { type: boolean }
    ManagedStaff:
      type: object
      required: [id, displayName, active, linked, serviceIds]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        active: { type: boolean }
        linked: { type: boolean }
        serviceIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    ManagedBusiness:
      type: object
      required: [business, services, staff]
      properties:
        business: { $ref: '#/components/schemas/BusinessProfile' }
        services:
          type: array
          items: { $ref: '#/components/schemas/ManagedService' }
        staff:
          type: array
          items: { $ref: '#/components/schemas/ManagedStaff' }
    Closure:
      type: object
      required: [id, professionalId, startAt, endAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        professionalId: { $ref: '#/components/schemas/Uuid' }
        startAt: { $ref: '#/components/schemas/UtcTimestamp' }
        endAt: { $ref: '#/components/schemas/UtcTimestamp' }
    ImpactBody:
      type: object
      properties:
        code: { type: string }
        error: { type: string }
        affectedCount: { type: integer }
        impactToken: { type: string }

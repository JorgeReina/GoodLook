openapi: 3.0.3
info:
  title: GoodLook API
  version: 0.1.0
  description: |
    Contrato de las rutas que monta `createRuntimeApp` al ejecutar `npm start`
    o al cargar `api/index.ts`. Este archivo no es una ruta HTTP: el proceso
    no sirve Swagger ni este YAML.

    Las escrituras comparan la cabecera `Origin` con `APP_ORIGIN`. La sesión
    viaja en la cookie `goodlook_session` (HttpOnly, Secure, SameSite=Strict).
    Salvo `GET /health` y los GET públicos de catálogo (`/api/catalog` y
    los listados del piloto `/api/businesses` y `/api/services`), las
    respuestas de estas rutas envían `Cache-Control: no-store`. Los 200
    de catálogo público envían `public, s-maxage=60, stale-while-revalidate=300`.

    Hay dos familias. El piloto usa `/api/appointments` y el catálogo de
    `/api/businesses`. El producto usa `/api/catalog`, `/api/bookings`,
    `/api/me`, `/api/agenda` y `/api/manage`.

    Cualquier petición con cuerpo puede responder `400` `{ "error": "Invalid JSON" }`
    o `413` `{ "error": "Request too large" }` (límite 32 KiB) antes de llegar
    a la ruta. Esas respuestas están repetidas en cada operación.
servers:
  - url: http://127.0.0.1:3000
    description: Proceso local. El puerto es `PORT` y por defecto es 3000.
tags:
  - name: health
    description: Comprobación de que el proceso responde.
  - name: auth
    description: Alta de cuenta, sesión y cierre.
  - name: catalogo-piloto
    description: Negocios, servicios, horarios y perfiles que consulta el piloto.
  - name: catalogo-publico
    description: Ficha y oferta publicada que consulta el producto.
  - name: citas-piloto
    description: Huecos, reserva y consulta de citas del piloto.
  - name: reservas
    description: Confirmación de producto con clave de idempotencia.
  - name: producto
    description: Pertenencias, citas del cliente y semana de agenda.
  - name: gestion
    description: Ficha, servicios, equipo, horarios y cierres.
  - name: invitaciones
    description: Emisión, aceptación y revocación de un vínculo profesional.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      summary: Salud del proceso
      responses:
        '400': { $ref: '#/components/responses/InvalidJson' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Proceso en marcha.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/auth/register:
    post:
      tags: [auth]
      operationId: postApiAuthRegister
      security: []
      summary: Alta de cuenta, sin iniciar sesión
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
                displayName: { type: string, maxLength: 120 }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/ErrorInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '409':
          description: El correo ya existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorText' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UnavailableError' }
  /api/auth/login:
    post:
      tags: [auth]
      operationId: postApiAuthLogin
      security: []
      summary: Inicio de sesión
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Perfil público y cookie de sesión de 24 horas.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/ErrorInvalid' }
        '401':
          description: Credenciales no válidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorText' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UnavailableError' }
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getApiAuthMe
      summary: Identidad de la cookie
      security: [{ sessionCookie: [] }]
      responses:
        '400': { $ref: '#/components/responses/InvalidJson' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Perfil de la sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: postApiAuthLogout
      security: []
      summary: Revoca la sesión y borra la cookie
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      responses:
        '400': { $ref: '#/components/responses/InvalidJson' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Cookie retirada. }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
  /api/businesses:
    get:
      tags: [catalogo-piloto]
      operationId: getApiBusinesses
      security: []
      summary: Negocios publicados del catálogo de piloto
      parameters:
        - { $ref: '#/components/parameters/CatalogPage' }
        - { $ref: '#/components/parameters/CatalogLimit' }
      responses:
        '400': { $ref: '#/components/responses/CatalogError' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Solo `id`, `name` y `timezone` de negocios con `is_public`.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
            X-Has-More: { $ref: '#/components/headers/XHasMore' }
            Link: { $ref: '#/components/headers/CatalogNextLink' }
            Access-Control-Expose-Headers: { $ref: '#/components/headers/CatalogExposeHeaders' }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, timezone]
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    timezone: { type: string }
    post:
      tags: [catalogo-piloto]
      operationId: postApiBusinesses
      summary: Crea un negocio privado y la membresía owner
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, timezone]
              properties:
                name: { type: string, maxLength: 160 }
                timezone: { type: string, description: Identificador IANA aceptado por Intl. }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Negocio creado, privado.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, timezone, isPublic]
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  timezone: { type: string }
                  isPublic: { type: boolean, enum: [false] }
        '400': { $ref: '#/components/responses/CatalogError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
  /api/businesses/visibility:
    put:
      tags: [catalogo-piloto]
      operationId: putApiBusinessesVisibility
      summary: Publica o retira un negocio
      description: |
        Con el proceso real, esta ruta llama a gestión. Solo el owner puede
        cambiar la visibilidad. La primera publicación exige nombre, sector,
        dirección y al menos una oferta con profesional vinculado, asignación,
        servicio activo y horario.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId, isPublic]
              properties:
                businessId: { $ref: '#/components/schemas/Uuid' }
                isPublic: { type: boolean }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Visibilidad actualizada. }
        '400': { $ref: '#/components/responses/CatalogError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '409': { $ref: '#/components/responses/ManagementConflict' }
  /api/services:
    get:
      tags: [catalogo-piloto]
      operationId: getApiServices
      security: []
      summary: Servicios activos de un negocio publicado
      parameters:
        - name: businessId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - { $ref: '#/components/parameters/CatalogPage' }
        - { $ref: '#/components/parameters/CatalogLimit' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Lista de servicios activos.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
            X-Has-More: { $ref: '#/components/headers/XHasMore' }
            Link: { $ref: '#/components/headers/CatalogNextLink' }
            Access-Control-Expose-Headers: { $ref: '#/components/headers/CatalogExposeHeaders' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogService' }
        '400': { $ref: '#/components/responses/CatalogError' }
    post:
      tags: [catalogo-piloto]
      operationId: postApiServices
      summary: Alta de servicio por owner o admin
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ServiceWrite'
                - type: object
                  required: [businessId]
                  properties:
                    businessId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Servicio creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogService' }
        '400': { $ref: '#/components/responses/CatalogError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/CatalogForbidden' }
  /api/services/assign:
    post:
      tags: [catalogo-piloto]
      operationId: postApiServicesAssign
      summary: Asigna un servicio activo a un profesional
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId, professionalId, serviceId]
              properties:
                businessId: { $ref: '#/components/schemas/Uuid' }
                professionalId: { $ref: '#/components/schemas/Uuid' }
                serviceId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Asignación activa. }
        '400': { $ref: '#/components/responses/CatalogError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/CatalogForbidden' }
        '404': { $ref: '#/components/responses/CatalogError' }
  /api/schedules:
    get:
      tags: [catalogo-piloto]
      operationId: getApiSchedules
      summary: Horario semanal de un profesional
      description: Owner, admin o el propio profesional vinculado.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessIdQuery' }
        - name: professionalId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Franjas ordenadas. El fin de jornada puede ser `24:00`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkPeriod' }
        '400': { $ref: '#/components/responses/ScheduleInvalid' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/CatalogForbidden' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
    put:
      tags: [catalogo-piloto]
      operationId: putApiSchedules
      summary: Sustituye el horario semanal
      description: |
        Owner o admin. Con gestión montada, si el cambio afecta a citas
        futuras la API responde 409 hasta recibir `X-GoodLook-Impact`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Impact' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId, professionalId, hours]
              properties:
                businessId: { $ref: '#/components/schemas/Uuid' }
                professionalId: { $ref: '#/components/schemas/Uuid' }
                hours:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/WorkPeriod' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '204': { description: Horario sustituido. }
        '400': { $ref: '#/components/responses/ScheduleInvalid' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/CatalogForbidden' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '409': { $ref: '#/components/responses/ManagementConflict' }
  /api/professionals:
    get:
      tags: [catalogo-piloto]
      operationId: getApiProfessionals
      security: []
      summary: Profesionales activos de un negocio publicado
      parameters:
        - { $ref: '#/components/parameters/BusinessIdQuery' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Identificador y nombre público. Sin cuentas.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, businessId, displayName]
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    businessId: { $ref: '#/components/schemas/Uuid' }
                    displayName: { type: string }
        '400':
          description: '`businessId` no es un UUID.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorText' }
    post:
      tags: [catalogo-piloto]
      operationId: postApiProfessionals
      summary: Crea un perfil profesional sin cuenta
      description: Owner o admin. No envía correo ni vincula un usuario.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId, displayName]
              properties:
                businessId: { $ref: '#/components/schemas/Uuid' }
                displayName: { type: string, maxLength: 120 }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Perfil creado.
          content:
            application/json:
              schema:
                type: object
                required: [id, businessId, displayName]
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  businessId: { $ref: '#/components/schemas/Uuid' }
                  displayName: { type: string }
        '400':
          description: Entrada no válida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorText' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
  /api/catalog/businesses:
    get:
      tags: [catalogo-publico]
      operationId: getApiCatalogBusinesses
      security: []
      summary: Fichas publicadas, también sin oferta
      parameters:
        - { $ref: '#/components/parameters/CatalogPage' }
        - { $ref: '#/components/parameters/CatalogLimit' }
      responses:
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Negocios con `is_public`.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
            X-Has-More: { $ref: '#/components/headers/XHasMore' }
            Link: { $ref: '#/components/headers/CatalogNextLink' }
            Access-Control-Expose-Headers: { $ref: '#/components/headers/CatalogExposeHeaders' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicBusiness' }
  /api/catalog/businesses/{id}:
    get:
      tags: [catalogo-publico]
      operationId: getApiCatalogBusinessesById
      security: []
      summary: Ficha publicada por id
      description: |
        El mismo objeto `PublicBusiness` que un elemento de `GET /api/catalog/businesses`
        (`id`, `name`, `sector`, `address`, `timezone`). El `id` es UUID, como en el resto
        de `/api/catalog`. `0`, negativos, decimales, texto o enteros que no son UUID
        responden 400. La consulta exige `is_public=TRUE`. Un negocio inexistente o
        privado responde el mismo 404. No coincide con `/services` ni `/professionals`.
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Ficha pública.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBusiness' }
        '400':
          description: El id no es un UUID.
          headers:
            Cache-Control: { $ref: '#/components/headers/CatalogNoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, enum: [invalid_input] }
        '404':
          description: No existe o no está publicado.
          headers:
            Cache-Control: { $ref: '#/components/headers/CatalogNoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, enum: [not_found] }
  /api/catalog/businesses/{id}/services:
    get:
      tags: [catalogo-publico]
      operationId: getApiCatalogBusinessesByIdServices
      security: []
      summary: Oferta reservable de un negocio publicado
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/CatalogPage' }
        - { $ref: '#/components/parameters/CatalogLimit' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Servicios activos con profesional vinculado, asignación y horario.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
            X-Has-More: { $ref: '#/components/headers/XHasMore' }
            Link: { $ref: '#/components/headers/CatalogNextLink' }
            Access-Control-Expose-Headers: { $ref: '#/components/headers/CatalogExposeHeaders' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicService' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '404': { $ref: '#/components/responses/CodeNotFound' }
  /api/catalog/businesses/{id}/professionals:
    get:
      tags: [catalogo-publico]
      operationId: getApiCatalogBusinessesByIdProfessionals
      security: []
      summary: Profesionales reservables para un servicio
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: serviceId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - { $ref: '#/components/parameters/CatalogPage' }
        - { $ref: '#/components/parameters/CatalogLimit' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Profesionales activos, vinculados y con horario.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCatalogCache' }
            X-Has-More: { $ref: '#/components/headers/XHasMore' }
            Link: { $ref: '#/components/headers/CatalogNextLink' }
            Access-Control-Expose-Headers: { $ref: '#/components/headers/CatalogExposeHeaders' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicStaff' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '404': { $ref: '#/components/responses/CodeNotFound' }
  /api/appointments/availability:
    get:
      tags: [citas-piloto]
      operationId: getApiAppointmentsAvailability
      security: []
      summary: Huecos orientativos
      description: |
        Ventana máxima de siete días. Los candidatos son futuros, caben en la
        jornada y en un cierre a las 24:00, y van en pasos de 15 minutos UTC.
        Restan citas ocupadas y cierres. No reserva el hueco. Límite de 30
        peticiones por minuto y por dirección de cliente. Express deja
        `trust proxy` desactivado. El cupo IPv6 es el /64; cada IPv4 es una
        dirección. Con `VERCEL=1` la primera IP de `x-vercel-forwarded-for`
        (cabecera ausente o inválida, 503); fuera de Vercel, la conexión
        directa. No se lee `X-Forwarded-For`.
      parameters:
        - { $ref: '#/components/parameters/BusinessIdQuery' }
        - name: professionalId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: serviceId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UtcTimestamp' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UtcTimestamp' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Zona del negocio y huecos libres.
          content:
            application/json:
              schema:
                type: object
                required: [timezone, slots]
                properties:
                  timezone: { type: string }
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/AppointmentError' }
        '422': { $ref: '#/components/responses/AppointmentError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Limitador ausente o averiado.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [Unavailable] }
  /api/appointments:
    post:
      tags: [citas-piloto]
      operationId: postApiAppointments
      summary: Reserva del piloto
      description: Sin clave de idempotencia. La sesión es el cliente.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PilotBooking' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '201':
          description: Cita creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/AppointmentError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '409': { $ref: '#/components/responses/AppointmentError' }
        '422': { $ref: '#/components/responses/AppointmentError' }
  /api/appointments/me:
    get:
      tags: [citas-piloto]
      operationId: getApiAppointmentsMe
      summary: Citas del cliente autenticado
      description: Intervalo máximo de 31 días. Como máximo 100 citas, por `start_at`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Citas propias en camelCase, sin notas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerAppointment' }
        '400': { $ref: '#/components/responses/AppointmentError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/appointments/agenda:
    get:
      tags: [citas-piloto]
      operationId: getApiAppointmentsAgenda
      summary: Agenda del piloto
      description: |
        Owner, admin o el profesional del perfil. La respuesta usa los nombres
        de columna de la consulta SQL, no camelCase. Unificarlos exigiría
        cambiar código.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessIdQuery' }
        - name: professionalId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Filas solapadas con el intervalo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PilotAgendaRow' }
        '400': { $ref: '#/components/responses/AppointmentError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/AppointmentError' }
  /api/bookings:
    post:
      tags: [reservas]
      operationId: postApiBookings
      summary: Reserva de producto
      description: |
        Exige `Idempotency-Key` UUID. La primera confirmación responde 201.
        La misma clave y el mismo cuerpo responden 200 con la cita ya creada.
        Otra clave usada con otro cuerpo responde 409 `idempotency_conflict`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductBooking' }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Reintento de la misma clave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '201':
          description: Cita nueva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Origen distinto de `APP_ORIGIN`.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, enum: [forbidden] }
        '409':
          description: Conflicto de hueco, oferta o clave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingConflict' }
  /api/me/memberships:
    get:
      tags: [producto]
      operationId: getApiMeMemberships
      summary: Pertenencias activas de la sesión
      security: [{ sessionCookie: [] }]
      responses:
        '400': { $ref: '#/components/responses/InvalidJson' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Membresías activas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalCode' }
  /api/me/bookings:
    get:
      tags: [producto]
      operationId: getApiMeBookings
      summary: Citas de producto del cliente
      description: Ventana máxima de 31 días. `cursor` es opaco y solo vale dentro de esa ventana.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Página de citas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalCode' }
  /api/agenda:
    get:
      tags: [producto]
      operationId: getApiAgenda
      summary: Semana de agenda de un profesional
      description: '`weekStart` es un lunes en `YYYY-MM-DD`. Sin acceso al perfil responde 403.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessIdQuery' }
        - name: professionalId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '200':
          description: Horario, cierres y citas de la semana local del negocio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaWeek' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: La sesión no puede ver ese perfil.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, enum: [forbidden] }
        '500': { $ref: '#/components/responses/InternalCode' }
  /api/manage/businesses:
    post:
      tags: [gestion]
      operationId: postApiManageBusinesses
      summary: Alta de negocio con ficha
